<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios - Biblioteca IEMAB</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="barra-nav">
    <div class="titulo"><img class="escudo-nav" src="assets/escudo.png" alt="" /><span>Biblioteca IEMAB</span></div>
    <nav>
      <a href="dashboard.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="mis-reservas.html" data-roles="estudiante">Mis préstamos</a>
      <a href="reservas.html" data-roles="administrador,bibliotecario">Reservas</a>
      <a href="prestamos.html" data-roles="administrador,bibliotecario">Préstamos</a>
      <a href="libros.html" data-roles="administrador,bibliotecario">Libros</a>
      <a href="usuarios.html" data-roles="administrador">Usuarios</a>
    </nav>
    <div class="usuario-info">
      <span id="nombre-usuario"></span>
      <button id="btn-cerrar-sesion">Salir</button>
    </div>
  </header>

  <main>
    <h1>Gestión de usuarios</h1>
    <div id="mensaje" class="mensaje oculto"></div>

    <div class="tarjeta">
      <h2 id="titulo-form">Crear usuario</h2>
      <form id="form-usuario">
        <input type="hidden" id="usuario-id" />

        <label>Nombre completo <input type="text" id="usuario-nombre" required /></label>

        <div id="campos-solo-creacion">
          <label>Correo electrónico <input type="email" id="usuario-email" /></label>
          <label>Contraseña temporal <input type="password" id="usuario-password" minlength="6" /></label>
          <p class="texto-ayuda">El usuario podrá cambiarla después desde su cuenta.</p>
        </div>

        <label>Rol
          <select id="usuario-rol">
            <option value="estudiante">Estudiante</option>
            <option value="docente">Docente</option>
            <option value="bibliotecario">Bibliotecario</option>
            <option value="administrador">Administrador</option>
          </select>
        </label>
        <label id="campo-curso">Curso (solo estudiantes) <input type="text" id="usuario-curso" placeholder="Ej: 11-A" /></label>
        <label>Documento <input type="text" id="usuario-documento" /></label>

        <div class="acciones">
          <button type="submit" id="btn-guardar-usuario">Crear usuario</button>
          <button type="button" id="btn-cancelar-edicion" class="secundario oculto">Cancelar edición</button>
        </div>
      </form>
    </div>

    <div class="tarjeta">
      <h2>Usuarios registrados</h2>
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr><th>Nombre</th><th>Rol</th><th>Curso</th><th>Documento</th><th>Activo</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tabla-usuarios"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
