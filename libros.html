<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libros - Biblioteca IEMAB</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="barra-nav">
    <div class="titulo"><img class="escudo-nav" src="assets/escudo.png" alt="" /><span>Biblioteca IEMAB</span></div>
    <nav>
      <a href="dashboard.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="mis-reservas.html" data-roles="estudiante">Mis préstamos</a>
      <a href="reservas.html" data-roles="administrador,bibliotecario">Reservas</a>
      <a href="prestamos.html" data-roles="administrador,bibliotecario">Préstamos</a>
      <a href="libros.html" data-roles="administrador,bibliotecario">Libros</a>
      <a href="usuarios.html" data-roles="administrador">Usuarios</a>
    </nav>
    <div class="usuario-info">
      <span id="nombre-usuario"></span>
      <button id="btn-cerrar-sesion">Salir</button>
    </div>
  </header>

  <main>
    <h1>Gestión de libros</h1>
    <div id="mensaje" class="mensaje oculto"></div>

    <div class="tarjeta">
      <h2 id="titulo-form">Agregar libro</h2>
      <form id="form-libro">
        <input type="hidden" id="libro-id" />
        <label>Título <input type="text" id="libro-titulo" required /></label>
        <label>Autor <input type="text" id="libro-autor" /></label>
        <label>ISBN <input type="text" id="libro-isbn" /></label>
        <label>Categoría <input type="text" id="libro-categoria" /></label>
        <label>Descripción <textarea id="libro-descripcion" rows="3"></textarea></label>
        <label>Portada (imagen) <input type="file" id="libro-portada" accept="image/*" /></label>
        <div class="acciones">
          <button type="submit" id="btn-guardar-libro">Guardar</button>
          <button type="button" id="btn-cancelar-edicion" class="secundario oculto">Cancelar edición</button>
        </div>
      </form>
    </div>

    <div class="tarjeta">
      <h2>Catálogo actual</h2>
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr><th>Portada</th><th>Título</th><th>Autor</th><th>Estado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tabla-libros"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/libros.js"></script>
</body>
</html>
