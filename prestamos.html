<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Préstamos - Biblioteca IEMAB</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="barra-nav">
    <div class="titulo"><img class="escudo-nav" src="assets/escudo.png" alt="" /><span>Biblioteca IEMAB</span></div>
    <nav>
      <a href="dashboard.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="mis-reservas.html" data-roles="estudiante">Mis préstamos</a>
      <a href="reservas.html" data-roles="administrador,bibliotecario">Reservas</a>
      <a href="prestamos.html" data-roles="administrador,bibliotecario">Préstamos</a>
      <a href="libros.html" data-roles="administrador,bibliotecario">Libros</a>
      <a href="usuarios.html" data-roles="administrador">Usuarios</a>
    </nav>
    <div class="usuario-info">
      <span id="nombre-usuario"></span>
      <button id="btn-cerrar-sesion">Salir</button>
    </div>
  </header>

  <main>
    <h1>Gestión de préstamos</h1>
    <div id="mensaje" class="mensaje oculto"></div>

    <div class="tarjeta">
      <h2>Préstamos activos</h2>
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr><th>Libro</th><th>Estudiante</th><th>Curso</th><th>Entregado</th><th>Fecha límite</th><th>Estado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tabla-activos"></tbody>
        </table>
      </div>
    </div>

    <div class="tarjeta">
      <h2>Últimas devoluciones</h2>
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr><th>Libro</th><th>Estudiante</th><th>Devuelto</th></tr>
          </thead>
          <tbody id="tabla-devueltos"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/prestamos.js"></script>
</body>
</html>
